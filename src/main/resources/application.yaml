spring:
  application:
    name: senaiflix

  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/senaiflix
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: always
